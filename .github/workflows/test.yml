name: test

on:
  push:
  pull_request:

jobs:
  hooks:
    # The hook suite on every platform casefile runs on, at the oldest and newest Python it supports
    # (D-027: Python >= 3.10; D-048: standard library for hooks/ and skills/, uv dev dependencies
    # for development).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.0
      # The matrix entry "3.x" is not a version uv understands, so uv gets the interpreter path.
      - run: uv sync --locked --python "${{ steps.py.outputs.python-path }}"
      - run: uv run --locked --python "${{ steps.py.outputs.python-path }}" ruff check
      - run: uv run --locked --python "${{ steps.py.outputs.python-path }}" pytest -v

  validate:
    # Manifests, agent and skill frontmatter. Needs no login. The trigger evals (evals/) are billed,
    # so they run on demand: claude plugin eval . --ablation none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.300
      - run: claude plugin validate .
